name: Dependabot auto-merge

on:
  pull_request_target:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Only auto-merge patch/minor bumps. Major version bumps and
      # anything outside react-frontweb's npm ecosystem (no CI gate
      # yet for maven/spring-backend) are left for manual review.
      - name: Enable auto-merge for patch/minor npm updates
        if: |
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          steps.metadata.outputs.package-ecosystem == 'npm' &&
          steps.metadata.outputs.directory == '/react-frontweb'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
